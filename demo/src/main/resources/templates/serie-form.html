<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuova serie</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Oswald', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- Header Navigation -->
    <header class="bg-slate-800/80 border-b border-slate-700/60 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <a th:href="@{/}" class="text-slate-300 hover:text-white transition-colors flex items-center space-x-2 text-sm font-medium">
                <i class="fa-solid fa-arrow-left text-xs"></i>
                <span>Torna alla collezione</span>
            </a>
            <div class="font-display text-xl font-bold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400">
                MANGADEX
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 flex-1 w-full">
        
        <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 md:p-8 shadow-xl backdrop-blur-sm">
            <div class="mb-6">
                <h1 class="font-display text-3xl font-bold tracking-wide text-white">Aggiungi una nuova serie</h1>
                <p class="text-slate-400 text-sm mt-1">Inserisci le informazioni relative alla nuova opera per includerla nella tua collezione.</p>
            </div>

            <form th:action="@{/serie}" th:object="${mangaSeries}" method="post" class="space-y-5">
                
                <div>
                    <label for="title" class="block text-sm font-medium text-slate-200 mb-1.5">Titolo *</label>
                    <input type="text" id="title" th:field="*{title}" required placeholder="es. One Piece"
                           class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label for="author" class="block text-sm font-medium text-slate-200 mb-1.5">Autore</label>
                        <input type="text" id="author" th:field="*{author}" placeholder="es. Eiichiro Oda"
                               class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500">
                    </div>

                    <div>
                        <label for="publisherIt" class="block text-sm font-medium text-slate-200 mb-1.5">Editore (IT)</label>
                        <input type="text" id="publisherIt" th:field="*{publisherIt}" placeholder="es. Star Comics"
                               class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 pt-2 border-t border-slate-700/50">
                    <div>
                        <label for="statusIt" class="block text-sm font-medium text-slate-200 mb-1.5">Stato (IT)</label>
                        <input type="text" id="statusIt" th:field="*{statusIt}" placeholder="es. In corso / Concluso"
                               class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500">
                    </div>

                    <div>
                        <label for="latestVolumeIt" class="block text-sm font-medium text-slate-200 mb-1.5">Ultimo volume uscito in IT</label>
                        <input type="number" id="latestVolumeIt" th:field="*{latestVolumeIt}" min="0" placeholder="es. 108"
                               class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 pt-2 border-t border-slate-700/50">
                    <div>
                        <label for="statusJp" class="block text-sm font-medium text-slate-200 mb-1.5">Stato (JP)</label>
                        <input type="text" id="statusJp" th:field="*{statusJp}" placeholder="es. In corso / Concluso"
                               class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500">
                    </div>

                    <div>
                        <label for="latestVolumeJp" class="block text-sm font-medium text-slate-200 mb-1.5">Ultimo volume uscito in JP</label>
                        <input type="number" id="latestVolumeJp" th:field="*{latestVolumeJp}" min="0" placeholder="es. 110"
                               class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 pt-2 border-t border-slate-700/50">
                    <div>
                        <label for="animeclickUrl" class="block text-sm font-medium text-slate-200 mb-1.5">URL AnimeClick</label>
                        <input type="text" id="animeclickUrl" th:field="*{animeclickUrl}" placeholder="https://www.animeclick.it/manga/..."
                               class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500">
                    </div>

                    <div>
                        <label for="anilistId" class="block text-sm font-medium text-slate-200 mb-1.5">ID Anilist</label>
                        <input type="number" id="anilistId" th:field="*{anilistId}" placeholder="es. 30013"
                               class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500">
                    </div>
                </div>

                <div class="pt-4 flex items-center justify-end space-x-3">
                    <a th:href="@{/}" class="px-5 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium rounded-lg transition-colors">
                        Annulla
                    </a>
                    <button type="submit" 
                            class="px-6 py-2.5 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-medium text-sm rounded-lg shadow-lg hover:shadow-purple-500/25 transition-all">
                        Salva Serie
                    </button>
                </div>

            </form>
        </div>

    </main>

</body>
</html>
